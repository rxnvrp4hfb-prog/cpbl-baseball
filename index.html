<script>
const $=s=>document.querySelector(s);let selected=null, games=[], reminders=[]; const LINE_TARGET='line:U445402135b60f91b93a5ee7a92cba14c';
const API_BASE='https://api.leokuo.com/cpbl';
let seasonClosed=false;
const seasonFetch=window.fetch.bind(window);
function showSeasonClosed(){
 if(document.getElementById('seasonClosed'))return;
 const overlay=document.createElement('section');overlay.id='seasonClosed';overlay.setAttribute('aria-label','休季公告');
 overlay.innerHTML='<div><p style="letter-spacing:.2em;color:#96cdb7">CPBL LIVE BOARD</p><h1 style="font-size:clamp(30px,6vw,52px);margin:20px 0">休季中</h1><p style="color:#b7bdc8">本站暫停開放，賽季開始後再見。</p></div>';
 overlay.style.cssText='position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#17191e;color:#f2f3f5;text-align:center;padding:24px';
 for(const element of document.body.children){if(!['SCRIPT','STYLE'].includes(element.tagName))element.inert=true;}
 document.body.append(overlay);document.body.style.overflow='hidden';
}
async function checkSeason(){
 try{const response=await seasonFetch(API_BASE+'/season',{cache:'no-store',signal:AbortSignal.timeout(6000)});if(!response.ok)return !seasonClosed;const state=await response.json();
 if(state.enabled===false){seasonClosed=true;showSeasonClosed();return false;}
 if(seasonClosed){location.reload();return false;}return true;
 }catch{return !seasonClosed;}
}
const seasonReady=checkSeason();
window.fetch=async(input,options)=>{
 const url=typeof input==='string'?input:input instanceof URL?input.href:input.url;
 if(url.startsWith(API_BASE)&&!url.startsWith(API_BASE+'/season')){
  await seasonReady;
  if(seasonClosed)return new Response(JSON.stringify({ok:false,seasonDisabled:true,error:'休季中，已停止查詢'}),{status:503,headers:{'Content-Type':'application/json'}});
  const response=await seasonFetch(input,options);
  if(response.status===503){const state=await response.clone().json().catch(()=>({}));if(state.seasonDisabled){seasonClosed=true;showSeasonClosed();}}
  return response;
 }return seasonFetch(input,options);
};
setInterval(checkSeason,60000);

function apiUrl(path){ return `${API_BASE}${String(path).replace(/^\/api/,'')}`; }
window.addEventListener('error',e=>{ console.error(e.error||e.message); const st=$('#state'); if(st) st.innerHTML=`<span class="error">畫面錯誤：${e.message}</span>`; });
window.addEventListener('unhandledrejection',e=>{ console.error(e.reason); const st=$('#state'); if(st) st.innerHTML=`<span class="error">畫面錯誤：${e.reason?.message||e.reason}</span>`; });
function statusClass(g){ if(pauseReason(g)||isInningBreak(g)) return 'status break'; if(g.statusCode===2) return 'status live'; if(g.statusCode===3) return 'status final'; if(g.statusCode===1) return 'status pregame'; return 'status'; }
function score(v){ return v===null || v===undefined || v==='' ? '-' : v; }
function setApiStatus(ok){ const el=$('#apiLight'); el.classList.remove('ok','bad'); el.classList.add(ok?'ok':'bad'); el.title=ok?'API 正常':'API 失敗'; }
function taipeiHour(){ return Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Taipei',hour:'2-digit',hourCycle:'h23'}).format(new Date())); }
function isQuietHours(){ const hour=taipeiHour(); return hour>=1&&hour<13; }
function showQuietHours(){ const light=$('#apiLight'), delay=$('#apiDelay'); light?.classList.remove('ok','bad'); if(light) light.title='凌晨 1:00 至下午 1:00 暫停自動抓取'; if(delay){delay.textContent='休息';delay.title='下午 1:00 自動恢復更新';delay.className='api-delay';} const state=$('#state'); if(state&&!games.length) state.textContent='凌晨 1:00 至下午 1:00 暫停自動更新'; }
async function pingApi(force=false){ if(!force&&isQuietHours()){showQuietHours();return;} try{ const r=await fetch(apiUrl('/api/games?ping=1'),{cache:'no-store'}); const data=await r.json(); setApiStatus(!!data.ok); }catch(e){ setApiStatus(false); } }
function updateNetworkStatus(){ const online=navigator.onLine!==false; const el=$('#networkBadge'); if(!el) return; if(!el.querySelector('.wifi-icon')) el.innerHTML='<span class="wifi-icon"><i></i></span>'; el.classList.toggle('offline',!online); el.title=online?'網路正常':'沒有網路'; }
function updateApiDelay(ts,g){ const el=$('#apiDelay'); if(!el) return; if(g && Number(g.statusCode)===3){ el.textContent='結束'; el.title='比賽已結束，不計算即時延遲'; el.className='api-delay'; return; } if(!ts){ el.textContent='--s'; el.className='api-delay'; return; } const t=new Date(String(ts).replace(' ','T')).getTime(); if(!Number.isFinite(t)){ el.textContent='--s'; el.className='api-delay'; return; } const sec=Math.max(0,Math.round((Date.now()-t)/1000)); el.textContent=`${sec}s`; el.title=`API 最新逐球時間：${ts}`; el.className='api-delay'+(sec>60?' bad':sec>25?' warn':''); }
let voiceOn=localStorage.getItem('voice-on')==='1', mascotNamesOn=localStorage.getItem('mascot-names-on')==='1', lastCountState=null, browserNotifiedReminders=new Set();
let inningBreaks={};
let breakDetectOn=localStorage.getItem('break-detect-off')!=='1';
function updateBreakBtn(){ const b=$('#breakBtn'); if(!b) return; b.textContent='局'; b.classList.toggle('off',!breakDetectOn); b.title=breakDetectOn?'局間偵測：開':'局間偵測：關'; }
function toggleBreakDetect(){ breakDetectOn=!breakDetectOn; localStorage.setItem('break-detect-off',breakDetectOn?'0':'1'); if(!breakDetectOn) inningBreaks={}; updateBreakBtn(); const g=games.find(x=>x.id===selected); if(g) renderDetail(g); }
function updateVoiceBtn(){ const b=$('#voiceBtn'); b.innerHTML=`<span class="ui-ico voice ${voiceOn?'on':'off'}"><i></i></span>`; b.title=voiceOn?'語音播報：開':'語音播報：關'; }
function toggleVoice(){ voiceOn=!voiceOn; localStorage.setItem('voice-on',voiceOn?'1':'0'); updateVoiceBtn(); if(voiceOn) speak('語音播報已開啟'); }
function updateMascotBtn(){ const b=$('#mascotBtn'); if(!b) return; b.classList.toggle('active-fun',mascotNamesOn); b.title=mascotNamesOn?'吉祥物模式：開':'吉祥物模式：關'; }
function toggleMascotNames(){ mascotNamesOn=!mascotNamesOn; localStorage.setItem('mascot-names-on',mascotNamesOn?'1':'0'); updateMascotBtn(); const g=games.find(x=>x.id===selected); if(g) renderDetail(g); }
function zhNum(n){ return ['零','一','兩','三'][Number(n)] || String(n); }
function speak(text){ if(!voiceOn || !('speechSynthesis' in window) || !text) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='zh-TW'; u.rate=1.05; speechSynthesis.speak(u); }
function announceCounts(g){ if(!voiceOn || g.statusCode!==2) return; const state=`${g.id}|${g.balls||0}|${g.strikes||0}|${g.outs||0}`; if(lastCountState===null){ lastCountState=state; return; } if(state===lastCountState) return; lastCountState=state; const b=Number(g.balls||0), s=Number(g.strikes||0), o=Number(g.outs||0); let parts=[]; if(b===3&&s===2) parts.push('滿球數'); else { if(b>0) parts.push(`${zhNum(b)}壞球`); if(s>0) parts.push(`${zhNum(s)}好球`); } if(o>0) parts.push(`${zhNum(o)}出局`); speak(parts.join('，')); }
function timeText(t){ return t ? new Date(t).toLocaleString('zh-TW',{hour:'2-digit',minute:'2-digit',month:'2-digit',day:'2-digit'}) : ''; }
function countdownHtml(t){ if(!t) return ''; const target=new Date(t).getTime(); const ms=target-Date.now(); if(!Number.isFinite(ms) || ms<=0) return ''; const sec=Math.ceil(ms/1000), d=Math.floor(sec/86400), h=Math.floor((sec%86400)/3600), m=Math.floor((sec%3600)/60), s=sec%60; if(d>0) return `<span class="cd-label">開賽倒數</span><span class="cd-num">${d}天${pad(h)}時</span>`; if(h>0) return `<span class="cd-label">開賽倒數</span><span class="cd-num">${pad(h)}:${pad(m)}:${pad(s)}</span>`; return `<span class="cd-label">開賽倒數</span><span class="cd-num">${pad(m)}:${pad(s)}</span>`; }
function countdownPhase(t){ const ms=new Date(t).getTime()-Date.now(); if(!Number.isFinite(ms) || ms<=0 || ms>3*60*60000) return ''; if(ms<=5*60000) return 'urgent'; if(ms<=30*60000) return 'soon'; if(ms<=60*60000) return 'warm'; return ''; }
function isCountdownPregame(g){ const sc=Number(g.statusCode); const st=String(g.status||''); return (sc===1 || sc===4 || /未開賽|先發|打序/.test(st)) && !/比賽中|已結束|結束|取消|延賽/.test(st); }
function countdownBoardClass(g){ const phase=(isCountdownPregame(g) && g.time) ? countdownPhase(g.time) : ''; return phase==='warm'||phase==='soon'||phase==='urgent' ? ` countdown-ring ${phase}` : ''; }
function countdownRunner(g){ const phase=(isCountdownPregame(g) && g.time) ? countdownPhase(g.time) : ''; return phase ? '<span class="hero-runner"></span><span class="hero-runner" data-offset="0.5"></span>' : ''; }
function countdownChip(g){ if(!isCountdownPregame(g) || !g.time) return ''; const phase=countdownPhase(g.time); if(!phase) return ''; const html=countdownHtml(g.time); if(!html) return ''; return `<span class="countdown-chip ${phase}" data-start="${g.time}">${html}</span>`; }
function updateCountdowns(){ document.querySelectorAll('.countdown-chip[data-start]').forEach(el=>{ const board=el.closest('.hero'); const phase=countdownPhase(el.dataset.start); if(!phase){ if(board){ board.classList.remove('countdown-ring','warm','soon','urgent'); board.querySelectorAll('.hero-runner').forEach(x=>x.remove()); } el.remove(); return; } const html=countdownHtml(el.dataset.start); if(html && el.innerHTML!==html) el.innerHTML=html; if(!el.classList.contains(phase)) { el.classList.remove('warm','soon','urgent'); el.classList.add(phase); } if(board){ const isRing=phase==='warm'||phase==='soon'||phase==='urgent'; if(isRing!==board.classList.contains('countdown-ring')) board.classList.toggle('countdown-ring',isRing); if(!board.classList.contains(phase)) { board.classList.remove('warm','soon','urgent'); board.classList.add(phase); } if(isRing && !board.querySelector('.hero-runner')) { board.insertAdjacentHTML('afterbegin', '<span class="hero-runner"></span><span class="hero-runner" data-offset="0.5"></span>'); } } }); }
function updateHeroRunners(){
  document.querySelectorAll('.hero.countdown-ring').forEach(hero=>{
    const rect=hero.getBoundingClientRect();
    const w=rect.width, h=rect.height, edge=6, len=256;
    const perimeter=Math.max(1,2*(w+h));
    const urgent=hero.classList.contains('urgent');
    const cycle=urgent?5200:9200;
    const base=(performance.now()%cycle)/cycle;
    hero.querySelectorAll('.hero-runner').forEach(runner=>{
      
      let d=((base+(Number(runner.dataset.offset)||0))%1)*perimeter;
      if(d<w){ runner.style.width=len+'px'; runner.style.height=edge+'px'; runner.style.left=d+'px'; runner.style.top='0px'; runner.style.transform='translate(-50%,-50%)'; }
      else if((d-=w)<h){ runner.style.width=edge+'px'; runner.style.height=len+'px'; runner.style.left='100%'; runner.style.top=d+'px'; runner.style.transform='translate(-50%,-50%)'; }
      else if((d-=h)<w){ runner.style.width=len+'px'; runner.style.height=edge+'px'; runner.style.left=(w-d)+'px'; runner.style.top='100%'; runner.style.transform='translate(-50%,-50%)'; }
      else { d-=w; runner.style.width=edge+'px'; runner.style.height=len+'px'; runner.style.left='0px'; runner.style.top=(h-d)+'px'; runner.style.transform='translate(-50%,-50%)'; }
    });
  });
  requestAnimationFrame(updateHeroRunners);
}
requestAnimationFrame(updateHeroRunners);

function updateClock(){ $('#clock').textContent=new Date().toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}); }

function parseCsv(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(c==='"' && q && n==='"'){ cell+='"'; i++; continue; }
    if(c==='"'){ q=!q; continue; }
    if((c===',' || c==='，' || c==='\t') && !q){ row.push(cell.trim()); cell=''; continue; }
    if((c==='\n' || c==='\r') && !q){ if(c==='\r'&&n==='\n') i++; row.push(cell.trim()); if(row.some(x=>x!=='')) rows.push(row); row=[]; cell=''; continue; }
    cell+=c;
  }
  row.push(cell.trim()); if(row.some(x=>x!=='')) rows.push(row);
  return rows;
}
function splitCsvLine(line){ return parseCsv(line)[0]||[]; }
function normalizeDateLabel(v){ const s=String(v||'').replace(/\s+/g,' ').trim(); let m=s.match(/(\d{1,2})\s*[\/月-]\s*(\d{1,2})(?:日)?/); if(!m) return ''; const mo=+m[1], d=+m[2]; if(mo<1||mo>12||d<1||d>31) return ''; return `${pad(mo)}/${pad(d)}`; }
function looksLikeTime(v){ return parseTimeToMinutes(v)!==null; }
function expandDateCell(v){
  const s=String(v||'').trim(); let m=s.match(/(20\d{2})[-/](\d{1,2})[-/](\d{1,2})\s*[~～-]\s*(\d{1,2})$/);
  if(m){ const y=+m[1],mo=+m[2],d1=+m[3],d2=+m[4]; if(d2>=d1&&d2-d1<=10) return Array.from({length:d2-d1+1},(_,i)=>`${y}-${pad(mo)}-${pad(d1+i)}`); }
  m=s.match(/(\d{1,2})\/(\d{1,2})\s*[~～-]\s*(?:(\d{1,2})\/)?(\d{1,2})$/);
  if(m){ const mo=+m[1],d1=+m[2],mo2=m[3]?+m[3]:mo,d2=+m[4]; if(mo===mo2&&d2>=d1&&d2-d1<=10) return Array.from({length:d2-d1+1},(_,i)=>`${pad(mo)}/${pad(d1+i)}`); }
  return [s||'未分類'];
}
function parseWorkSchedule(text,name='流程表'){
  let rows=[];
  try{ const j=JSON.parse(text); if(Array.isArray(j)) rows=j.map(x=>({date:x.date||x.日期||'', time:x.time||x.時間||x.start||'', task:x.task||x.事項||x.title||x.name||''})); }catch(e){}
  if(!rows.length){
    const table=parseCsv(text);
    let dateHeaderRow=-1, bestDateCount=0;
    table.forEach((r,idx)=>{ const c=r.filter(x=>normalizeDateLabel(x)).length; if(c>bestDateCount){bestDateCount=c; dateHeaderRow=idx;} });
    if(dateHeaderRow>=0 && bestDateCount>=2){
      const headers=table[dateHeaderRow];
      const dateCols=headers.map((h,i)=>({i,date:normalizeDateLabel(h)})).filter(x=>x.date);
      let timeCol=0, bestTimeCount=-1;
      for(let c=0;c<Math.max(...table.map(r=>r.length));c++){ const cnt=table.slice(dateHeaderRow+1).filter(r=>looksLikeTime(r[c])).length; if(cnt>bestTimeCount){bestTimeCount=cnt; timeCol=c;} }
      rows=[];
      for(const r of table.slice(dateHeaderRow+1)){
        const time=r[timeCol]||''; if(!looksLikeTime(time)) continue;
        for(const dc of dateCols){
          if(dc.i===timeCol) continue;
          const task=(r[dc.i]||'').replace(/\s*\n\s*/g,' ').trim();
          if(task && task!=='&' && task!=='-' && task!=='—') rows.push({date:dc.date,time,task});
        }
      }
    } else {
      const first=table[0]||[];
      const hasHeader=first.some(x=>/日期|date/i.test(x)) || first.some(x=>/時間|time|start/i.test(x)) || first.some(x=>/事項|工作|task|title/i.test(x));
      let dateIdx=-1,timeIdx=0,taskIdx=1,start=0;
      if(hasHeader){ start=1; dateIdx=first.findIndex(x=>/日期|date/i.test(x)); timeIdx=first.findIndex(x=>/時間|time|start/i.test(x)); taskIdx=first.findIndex(x=>/事項|工作|task|title|內容/i.test(x)); if(timeIdx<0) timeIdx=0; if(taskIdx<0) taskIdx=timeIdx+1; }
      rows=table.slice(start).map(p=>({date:dateIdx>=0?p[dateIdx]:'未分類', time:p[timeIdx]||'', task:p.slice(taskIdx).join(' ').trim()||p[taskIdx]||''}));
    }
  }
  workItems=rows.flatMap(x=>expandDateCell(x.date||x.日期||'未分類').map(date=>{ const time=x.time||x.時間||''; return {date, time, task:x.task||x.事項||x.title||x.name||'', minutes:parseTimeToMinutes(time), endMinutes:parseEndMinutes(time)}; })).filter(x=>x.minutes!==null&&x.task).sort((a,b)=>a.minutes-b.minutes);
  updateWorkDateOptions(); saveWorkSchedule(); renderWorkStatus();
  alert(`流程表已解析：${workItems.length} 筆，日期：${[...new Set(workItems.map(x=>x.date))].join('、') || '無'}`);
}

function detectInningBreak(g){
  if(!breakDetectOn) return false;
  if(Number(g.statusCode)!==2){ delete inningBreaks[g.id]; return false; }
  const id=g.id, txt=String(g.liveText||''), inning=String(g.inningText||''), outs=Number(g.outs||0);
  const ended=/3人出局|三人出局|三出局/.test(txt) || outs>=3;
  const cur=countKey(g), rec=inningBreaks[id];
  if(rec && /比賽中/.test(String(g.status||'')) && outs<3 && !ended){ delete inningBreaks[id]; return false; }
  if(rec){
    const halfChanged=inning && rec.inning && inning!==rec.inning;
    const newPlay=cur!==rec.key && Number(g.outs||0)<3 && !/3人出局|三人出局|三出局|比賽結束/.test(txt);
    if(halfChanged || newPlay){ delete inningBreaks[id]; return false; }
    return true;
  }
  if(ended){ inningBreaks[id]={at:Date.now(),inning,key:cur}; return true; }
  return false;
}
function pauseReason(g){ if(Number(g.statusCode)===3 || /已結束|比賽結束|結束/.test(String(g.status||''))) return ''; if(g.pauseReason) return g.pauseReason; const txt=`${g.status||''} ${g.liveText||''}`; if(/更換投手|投手更換|換投|換上投手|投手交代|投手丘.*換/.test(txt)) return '更換投手暫停'; if(/教練.*暫停|暫停.*教練|教練喊停|教練上投手丘|投手教練/.test(txt)) return '教練暫停'; if(/因雨暫停|雨勢暫停|因雨延賽|天候因素暫停|比賽暫停|比賽中斷|比賽因故暫停|因故暫停|保留比賽|裁定比賽/.test(txt)){ if(/雨|天候|雷雨/.test(txt)) return '天候暫停'; if(/保留/.test(txt)) return '保留比賽'; if(/裁定/.test(txt)) return '裁定比賽'; if(/因故/.test(txt)) return '因故暫停'; return '暫停原因確認中'; } return ''; }

function breakOverlay(g){ const pause=pauseReason(g); if(pause) return `<div class="break-overlay rain"><div class="break-card">${pause}</div></div>`; if(!isInningBreak(g)) return ''; const txt=String(g.liveText||''); const outs=Number(g.outs||0); const stillEnded=/3人出局|三人出局|三出局/.test(txt) || outs>=3; return stillEnded ? '<div class="break-overlay"><div class="break-card">局間休息中</div></div>' : ''; }

function bases(g){ const b=g.bases||{}; return `<div class="diamond-card" style="--base-color:${battingColor(g)}"><div class="diamond"><div class="base second ${b.second?'on':''}" title="二壘 ${g.baseNames?.second||''}"></div><div class="base third ${b.third?'on':''}" title="三壘 ${g.baseNames?.third||''}"></div><div class="base first ${b.first?'on':''}" title="一壘 ${g.baseNames?.first||''}"></div><div class="home-plate"></div></div><div class="small">壘包狀態</div></div>`; }
function sbo(g){ const balls=g.balls||0,strikes=g.strikes||0,outs=g.outs||0; return `<div class="sbo-card"><div class="sbo-row"><div class="sbo-label">B</div><div class="dots">${dots('ball',balls,3)}</div><div class="sbo-num">${balls}</div></div><div class="sbo-row"><div class="sbo-label">S</div><div class="dots">${dots('strike',strikes,2)}</div><div class="sbo-num">${strikes}</div></div><div class="sbo-row"><div class="sbo-label">O</div><div class="dots">${dots('out',outs,2)}</div><div class="sbo-num">${outs}</div></div></div>`; }
function emptyBases(){ return `<div class="diamond-card"><div class="diamond"><div class="base second"></div><div class="base third"></div><div class="base first"></div><div class="home-plate"></div></div><div class="small">壘包狀態</div></div>`; }
function emptySbo(){ return `<div class="sbo-card"><div class="sbo-row"><div class="sbo-label">B</div><div class="dots">${dots('ball',0,3)}</div><div class="sbo-num">-</div></div><div class="sbo-row"><div class="sbo-label">S</div><div class="dots">${dots('strike',0,2)}</div><div class="sbo-num">-</div></div><div class="sbo-row"><div class="sbo-label">O</div><div class="dots">${dots('out',0,2)}</div><div class="sbo-num">-</div></div></div>`; }

function trimEndPunct(s){ return String(s||'').replace(/[。．.！!？?，,、；;：:\s]+$/g,''); }

function recentLines(g){ const rows=(g.recentLiveTexts||[]).slice(-4).reverse(); return rows.length ? rows.map(r=>`${r.inning ? r.inning+'　':''}${trimEndPunct(r.text)}`).join('\n').trim() : ''; }
function scoringLines(g){ const rows=(g.scoringPlays||[]).slice(-4).reverse(); return rows.length ? rows.map(r=>{ const team=r.teamSide==='away'?g.away:g.home; const runs=Number(r.runs||0); const scoreText=`${score(r.awayScore)}-${score(r.homeScore)}`; const hitter=r.hitter?`${r.hitter} 這個打席`: '這個打席'; const text=trimEndPunct(r.text||''); return `${r.inning? r.inning+'　':''}${team} +${runs}｜${hitter}｜${scoreText}${text?`｜${text}`:''}`; }).join('\n').trim() : ''; }
function battingTeam(g){ const side=String(g.battingSide||''); if(side==='1'||side==='V') return g.away; if(side==='2'||side==='H') return g.home; return '—'; }

function attackImg(src,fallback,cls){ return `<img class="${cls}" src="${src||fallback||''}" onerror="this.onerror=null;this.src='${fallback||''}'" />`; }
function attackAnimation(g){ if(!isLiveGame(g)) return ''; const side=String(g.battingSide||''); if(side==='1'||side==='V') return `<div class="attack-anim away" title="${g.away} 進攻，${g.home} 防守">${attackImg(mascotUrl(g,false),g.awayLogo,'attacker')}${attackImg(mascotUrl(g,true),g.homeLogo,'defender')}<span class="fear"></span></div>`; if(side==='2'||side==='H') return `<div class="attack-anim home" title="${g.home} 進攻，${g.away} 防守">${attackImg(mascotUrl(g,true),g.homeLogo,'attacker')}${attackImg(mascotUrl(g,false),g.awayLogo,'defender')}<span class="fear"></span></div>`; return ''; }
function pitchingTeam(g){ const side=String(g.battingSide||''); if(side==='1'||side==='V') return g.home; if(side==='2'||side==='H') return g.away; return '—'; }
function battingLogo(g){ const side=String(g.battingSide||''); if(side==='1'||side==='V') return g.awayLogo; if(side==='2'||side==='H') return g.homeLogo; return ''; }

function pitchingColor(g){ const side=String(g.battingSide||''); if(side==='1'||side==='V') return g.homeColor; if(side==='2'||side==='H') return g.awayColor; return '#5aa7ff'; }
function battingBoxColor(g){ const side=String(g.battingSide||''); if(side==='1'||side==='V') return g.awayColor; if(side==='2'||side==='H') return g.homeColor; return '#5aa7ff'; }
function pitchingMascot(g){ const side=String(g.battingSide||''); if(side==='1'||side==='V') return {src:mascotUrl(g,true), fallback:g.homeLogo||''}; if(side==='2'||side==='H') return {src:mascotUrl(g,false), fallback:g.awayLogo||''}; return {src:'', fallback:pitchingLogo(g)}; }

function battingMascot(g){ const side=String(g.battingSide||''); if(side==='1'||side==='V') return {src:mascotUrl(g,false), fallback:g.awayLogo||''}; if(side==='2'||side==='H') return {src:mascotUrl(g,true), fallback:g.homeLogo||''}; return {src:'', fallback:battingLogo(g)}; }

  if(inning===8 && (side==='2'||side==='H') && home<=away) return '9下：準備中\n延長賽：暫無';
  if(inning<9) return '9下：預計需要\n延長賽：暫無';
